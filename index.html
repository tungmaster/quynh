<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bất ngờ cho Em</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #ffdde1, #ee9ca7);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    #btn {
      padding: 20px 40px;
      font-size: 24px;
      border: none;
      border-radius: 12px;
      background: #ff4b5c;
      color: white;
      cursor: pointer;
      z-index: 2;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }
    #btn:active {
      transform: scale(0.95);
    }
    #card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      color: #ff4b5c;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: transform 0.7s ease;
      z-index: 3;
    }
    #card.show {
      transform: translate(-50%, -50%) scale(1);
    }
    .flower {
      position: absolute;
      width: 24px;
      height: 24px;
      background: url('https://cdn-icons-png.flaticon.com/512/616/616408.png') no-repeat center/cover;
      animation: fall 6s linear infinite;
      pointer-events: none;
    }
    @keyframes fall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <button id="btn">💖 Ấn vào đây 💖</button>
  <div id="card">Anh Yêu Em! 💕</div>
  <canvas id="fireworks"></canvas>

  <script>
    const btn = document.getElementById('btn');
    const card = document.getElementById('card');
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let started = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    btn.addEventListener('click', () => {
      btn.style.display = 'none';
      card.classList.add('show');
      started = true;
      createFlowers();
      setInterval(createFlowers, 500);
      launchFireworks();
      setInterval(launchFireworks, 1500);
    });

    // 🌸 Hoa rơi
    function createFlowers() {
      if (!started) return;
      const flower = document.createElement('div');
      flower.className = 'flower';
      flower.style.left = Math.random() * window.innerWidth + 'px';
      flower.style.animationDuration = 4 + Math.random() * 4 + 's';
      document.body.appendChild(flower);
      setTimeout(() => flower.remove(), 8000);
    }

    // 🎆 Pháo hoa
    class Firework {
      constructor(x, y, colors) {
        this.x = x;
        this.y = y;
        this.particles = [];
        this.colors = colors;
        for (let i = 0; i < 50; i++) {
          this.particles.push({
            x: x,
            y: y,
            dx: (Math.random() - 0.5) * 6,
            dy: (Math.random() - 0.5) * 6,
            life: 100
          });
        }
      }
      draw() {
        this.particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
          ctx.fillStyle = this.colors[Math.floor(Math.random()*this.colors.length)];
          ctx.fill();
        });
      }
      update() {
        this.particles.forEach(p => {
          p.x += p.dx;
          p.y += p.dy;
          p.dy += 0.05;
          p.life -= 1;
        });
        this.particles = this.particles.filter(p => p.life > 0);
      }
    }

    let fireworks = [];
    function launchFireworks() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height / 2);
      const colors = ["#ff4b5c","#ffd700","#00ffcc","#ff00ff","#ffffff"];
      fireworks.push(new Firework(x, y, colors));
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      fireworks.forEach((fw, i) => {
        fw.update();
        fw.draw();
        if (fw.particles.length === 0) {
          fireworks.splice(i,1);
        }
      });
    }
    animate();
  </script>
</body>
</html>
